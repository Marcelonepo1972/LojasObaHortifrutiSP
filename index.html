<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitas às Lojas Oba SP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1F8A2E; --verde-esc:#0F4D1A; --laranja:#F28C00; --tomate:#D93A2B; --pedra:#B4BBB5;
  --tinta:#173B1F; --tinta2:#5B6B5E; --fundo:#F4F8F1; --sup:#FFFFFF; --linha:#DCE6D7;
  --f-corpo:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-titulo:'Baloo 2','Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-corpo);color:var(--tinta);background:var(--fundo);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}

.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
header{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:6px 20px;align-items:center;padding:12px 22px 14px;
  background:radial-gradient(120% 140% at 100% 0%,#FFF1DC 0%,rgba(255,241,220,0) 45%),radial-gradient(90% 120% at 0% 100%,#E6F4DD 0%,rgba(230,244,221,0) 55%),#fff}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--verde) 0%,#7CC242 50%,var(--laranja) 100%)}
.logo{height:112px;grid-column:1;width:auto;grid-row:1/3;filter:drop-shadow(0 2px 4px rgba(15,77,26,.15))}
header h1{font-family:var(--f-titulo);font-weight:800;font-size:clamp(22px,2.8vw,34px);line-height:1.05;margin:0;color:var(--verde-esc)}
header p{margin:2px 0 0;color:var(--tinta2);font-size:14px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;grid-row:1;grid-column:3}
.titulo-box{grid-column:2;grid-row:1}
.trilha-wrap{grid-column:2/4;padding-top:6px}
.trilha{display:flex;gap:2px;height:12px}
.trilha button{flex:1;border:0;padding:0;border-radius:3px;min-width:3px;transition:transform .12s}
.trilha button:hover{transform:scaleY(1.6)}
.trilha-leg{display:flex;justify-content:space-between;color:var(--tinta2);font-size:12px;margin-top:5px}

.btn{border:1.5px solid transparent;border-radius:999px;padding:8px 16px;font-weight:700;background:var(--sup);color:var(--tinta)}
.btn.prim{background:var(--verde);color:#fff}
.btn.claro{background:#fff;border-color:var(--verde);color:var(--verde)}
.btn.laranja{background:var(--laranja);color:#fff}
.btn.perigo{background:transparent;border-color:var(--tomate);color:var(--tomate)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.corpo{display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto 1fr;min-height:0}
.kpis{grid-column:1/-1;display:flex;gap:10px;padding:12px 16px;overflow-x:auto}
.kpi{flex:1;min-width:130px;border:1px solid var(--linha);background:var(--sup);text-align:left;padding:10px 14px;border-radius:14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cor,var(--pedra))}
.kpi.ativo{box-shadow:0 0 0 2px var(--cor) inset}
.kpi b{display:block;font-family:var(--f-titulo);font-size:32px;line-height:1;font-weight:800;color:var(--cor,var(--tinta))}
.kpi span{font-size:13px;color:var(--tinta2);font-weight:600}
.kpi .barra{height:6px;border-radius:3px;background:var(--linha);margin-top:6px;overflow:hidden}
.kpi .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),#7CC242)}

.mapa-box{position:relative;min-height:0;margin:0 0 16px 16px;border-radius:18px;overflow:hidden;border:1px solid var(--linha);background:#EAF2E6}
#mapa{height:100%}
#svgMapa{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab}
#svgMapa:active{cursor:grabbing}
.zoom-rapido{position:absolute;z-index:5;top:12px;right:12px;display:flex;gap:6px}
.zoom-rapido button{border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--verde-esc);box-shadow:0 2px 6px rgba(15,77,26,.12)}
.zoom-rapido button:hover{border-color:var(--verde)}
.legenda{position:absolute;z-index:5;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--linha);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;display:flex;gap:12px;flex-wrap:wrap}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.aviso-mapa{position:absolute;z-index:6;left:50%;top:12px;transform:translateX(-50%);background:var(--laranja);color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;display:none}

.lista{display:flex;flex-direction:column;min-height:0;background:var(--sup);margin:0 16px 16px;border-radius:18px;border:1px solid var(--linha);overflow:hidden}
.filtros{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--linha);background:#FAFCF8}
.filtros input,.filtros select{width:100%;padding:8px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.filtros input{grid-column:1/-1}
.cont{padding:8px 14px;font-size:13px;color:var(--tinta2);display:flex;justify-content:space-between;align-items:center}
.cont button{border:0;background:none;color:var(--verde);font-weight:700;padding:0}
#itens{overflow-y:auto;flex:1}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);background:none;padding:10px 14px 10px 0}
.item:hover{background:#F4F9F0}
.item.sel{background:#E8F4E1}
.item i{border-radius:0 3px 3px 0}
.item strong{display:block;font-weight:700}
.item small{color:var(--tinta2)}
.item .st{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.item .st small{display:block;font-weight:400}
.vazio{padding:30px 16px;color:var(--tinta2);text-align:center}

.gaveta{position:fixed;z-index:1000;top:0;right:0;height:100%;width:min(420px,100%);background:var(--sup);box-shadow:-10px 0 34px rgba(15,77,26,.22);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.gaveta.aberta{transform:none}
.gav-topo{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#F1F8EC,#FFF4E3)}
.gav-topo h2{font-family:var(--f-titulo);font-weight:800;color:var(--verde-esc);font-size:26px;line-height:1.05;margin:0}
.gav-topo p{margin:4px 0 0;color:var(--tinta2);font-size:13px}
.fechar{border:0;background:none;font-size:28px;line-height:1;padding:0 4px;color:var(--tinta2)}
.gav-corpo{padding:16px 18px;overflow-y:auto;flex:1}
.gav-corpo label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
.gav-corpo input,.gav-corpo textarea,.gav-corpo select{width:100%;padding:9px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--fundo)}
.gav-corpo textarea{min-height:80px;resize:vertical}
.endereco{background:var(--fundo);border-radius:10px;padding:10px 12px;font-size:14px}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.links a,.links button{font-size:13px;font-weight:700;color:var(--verde);background:none;border:1.5px solid var(--verde);border-radius:999px;padding:6px 12px;text-decoration:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--linha);background:var(--sup);padding:10px 4px;font-weight:700;border-radius:12px}
.seg button[aria-pressed="true"][data-s="pendente"]{background:var(--pedra);border-color:var(--pedra);color:#fff}
.seg button[aria-pressed="true"][data-s="agendada"]{background:var(--laranja);border-color:var(--laranja);color:#fff}
.seg button[aria-pressed="true"][data-s="visitada"]{background:var(--verde);border-color:var(--verde);color:#fff}
.gav-rodape{padding:14px 18px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:space-between}
.bloqueio{margin-top:16px;padding:12px;border-radius:10px;background:#FFF3E0;color:#8A4B00;font-size:14px}
.hist{margin-top:18px;font-size:13px;color:var(--tinta2)}
.hist h3{font-size:13px;color:var(--tinta);margin:0 0 6px}
.hist div{padding:5px 0;border-top:1px dashed var(--linha)}
.dica{font-size:12px;color:var(--tinta2);margin-top:4px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.modal-fundo{position:fixed;inset:0;z-index:1100;background:rgba(15,40,20,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal-fundo.aberto{display:flex}
.modal{background:var(--sup);border-radius:20px;width:min(400px,100%);overflow:hidden}
.modal img{display:block;width:100%;height:auto;background:#fff}
.modal .m-corpo{padding:16px 20px 20px}
.modal h2{font-family:var(--f-titulo);font-weight:800;color:var(--verde-esc);margin:0 0 2px;font-size:26px}
.modal label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
.modal input{width:100%;padding:9px 12px;border:1px solid var(--linha);border-radius:10px}
.erro{color:var(--tomate);font-size:13px;margin-top:8px;min-height:18px}

.toast{position:fixed;z-index:1200;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--verde-esc);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;transition:transform .2s}
.toast.on{transform:translateX(-50%) translateY(0)}

.abas{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--linha);background:#FAFCF8}
.abas button{border:0;background:none;padding:12px;font-weight:800;color:var(--tinta2);border-bottom:3px solid transparent}
.abas button[aria-selected="true"]{color:var(--verde-esc);border-bottom-color:var(--verde)}
#painelRot,#painelLojas{display:flex;flex-direction:column;min-height:0;flex:1;overflow-y:auto}
#painelLojas{overflow:hidden}
.grupo{padding:12px 14px 6px;font-size:12.5px;font-weight:800;color:var(--verde);background:#FAFCF8;border-bottom:1px solid var(--linha)}
.rot{display:grid;grid-template-columns:5px 1fr auto;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);background:none;padding:10px 14px 10px 0;align-items:center}
.rot:hover{background:#F4F9F0}
.rot i{align-self:stretch;border-radius:0 3px 3px 0}
.rot strong{display:block;font-weight:800}
.rot small{color:var(--tinta2);font-size:12.5px}
.rot .st{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
.mini{display:block;height:5px;border-radius:3px;background:var(--linha);margin-top:5px;overflow:hidden;max-width:160px}
.mini b{display:block;height:100%;background:var(--verde)}
.rot-topo{padding:12px 14px 14px;border-bottom:1px solid var(--linha);background:linear-gradient(135deg,#F1F8EC,#FFF4E3)}
.rot-topo h3{font-family:var(--f-titulo);font-weight:800;font-size:26px;line-height:1.05;margin:6px 0 2px;color:var(--verde-esc)}
.rot-topo p{margin:0;color:var(--tinta2);font-size:13px}
.voltar{border:0;background:none;padding:0;color:var(--verde);font-weight:800;font-size:13px}
.voltar::before{content:"‹ "}
.rot-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rot-acoes input{padding:7px 10px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.rot-acoes .btn{text-decoration:none;padding:7px 14px;font-size:14px}
.rot-topo .dica{margin-top:8px}
@media (max-width:860px){
  .app{display:block;height:auto}
  html,body{height:auto}
  header{grid-template-columns:auto 1fr;padding:12px 14px 14px}
  .logo{height:70px;grid-row:1}
  .titulo-box{grid-column:2}
  .acoes{grid-column:1/-1;grid-row:3;justify-content:flex-start}
  .trilha-wrap{grid-column:1/-1}
  .corpo{display:block}
  .mapa-box{height:58vh;margin:0 12px 12px}
  .lista{margin:0 12px 12px}
  #itens{overflow:visible}
  #painelRot,#painelLojas{overflow:visible}
  .gaveta{top:auto;bottom:0;height:88vh;width:100%;border-radius:18px 18px 0 0;transform:translateY(105%)}
  .gaveta.aberta{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* cards fora do mapa com linha até a loja (só com roteiro aberto) */
const CARD_W = 178, CARD_H = 42, CARD_GAP = 8, CARD_MARGEM = 12;

function enquadrarRoteiro(){

  const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);

}

function etiquetasRoteiros(){

function posicionarEtiquetas(){

  const itens = lojasDoRoteiro(rotSel).map(([k, l], i) => { const [x, y] = PX(l.lat, l.lng); return {k, l, i, st:statusEf(l), sx:(x - vx0)/s, sy:(y - vy0)/s}; });

/* arrastar, zoom na roda e pinça */
const ponteiros = new Map(); let arrasto = null, moveu = false, pinca = null;
const pontoSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), s = escalaTela(), h = vista.w * r.height / r.width;
  return [vista.cx - vista.w/2 + (cx - r.left) * s, vista.cy - h/2 + (cy - r.top) * s]; };
function zoomEm(cx, cy, f){
  naEstado = false;
  const [x, y] = pontoSvg(cx, cy);
  const nw = Math.min(Math.max(vista.w / f, ESTADO_W / 400), ESTADO_W * 1.6), k = nw / vista.w;
  vista.cx = x + (vista.cx - x) * k; vista.cy = y + (vista.cy - y) * k; vista.w = nw; aplicarVista();
}
svg.addEventListener('wheel', e => { e.preventDefault(); zoomEm(e.clientX, e.clientY, e.deltaY < 0 ? 1.25 : 0.8); }, {passive:false});
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId); ponteiros.set(e.pointerId, [e.clientX, e.clientY]); moveu = false;
  if (ponteiros.size === 1) arrasto = {x:e.clientX, y:e.clientY, cx:vista.cx, cy:vista.cy, alvo:e.target};
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; pinca = Math.hypot(a[0]-b[0], a[1]-b[1]); arrasto = null; }
});
svg.addEventListener('pointermove', e => {
  if (!ponteiros.has(e.pointerId)) return;
  ponteiros.set(e.pointerId, [e.clientX, e.clientY]);
  if (ponteiros.size === 2 && pinca) {
    const [a, b] = [...ponteiros.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    zoomEm((a[0]+b[0])/2, (a[1]+b[1])/2, d / pinca); pinca = d; moveu = true; return;
  }
  if (!arrasto) return;
  const dx = e.clientX - arrasto.x, dy = e.clientY - arrasto.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) moveu = true;
  if (moveu) { naEstado = false; const s = escalaTela(); vista.cx = arrasto.cx - dx * s; vista.cy = arrasto.cy - dy * s; aplicarVista(); }
});
function soltar(e){
  if (!ponteiros.has(e.pointerId)) return;
  ponteiros.delete(e.pointerId);
  if (ponteiros.size < 2) pinca = null;
  if (arrasto && !moveu && e.type === 'pointerup') {
    const alvo = arrasto.alvo;
    if (alvo && alvo.dataset && alvo.dataset.k) abrirLoja(alvo.dataset.k);
    else if (alvo && alvo.dataset && alvo.dataset.r) selecionarRoteiro(alvo.dataset.r);
    else if (alvo && alvo.dataset && alvo.dataset.g) {
      const pts = ROTEIROS.filter(r => r.grupo === alvo.dataset.g).flatMap(r => lojasDoRoteiro(r.id)).map(([k, l]) => [l.lat, l.lng]);
      if (pts.length) mapa.fitBounds(pts);

      const [x, y] = pontoSvg(e.clientX, e.clientY), [lat, lng] = LL(x, y);
      $('nCoord').value = lat.toFixed(6) + ', ' + lng.toFixed(6);
      marcarTemp(lat, lng); $('avisoMapa').style.display = 'none';
    }

}
svg.addEventListener('pointerup', soltar);

  }
  const r = ROT_ID[rotSel], s = resumoRot(rotSel), ls = lojasDoRoteiro(rotSel);
  box.innerHTML = `
    <div class="rot-topo">
      <button class="voltar" id="rVoltar">Todos os roteiros</button>
      <h3>${esc(r.nome)}</h3>
      <p>${num(s.v)} de ${num(s.n)} lojas visitadas · ${esc(r.grupo)}</p>
      <div class="rot-acoes">
        ${editor ? `<input type="date" id="rData" value="${s.proxData || ''}" aria-label="Data do roteiro"><button class="btn prim" id="rAgendar">Agendar roteiro</button>` : ''}
        <a class="btn claro" href="${rotaGoogle(rotSel)}" target="_blank" rel="noopener">Abrir rota no Google Maps</a>
      </div>
      ${editor ? '<p class="dica">Agendar aplica a data em todas as lojas do roteiro que ainda não foram visitadas.</p>' : ''}
    </div>
    ${ls.map(([k, l], i) => {
      const st = statusEf(l);
      const data = st === 'visitada' ? br(l.dataVisita) : (st === 'agendada' || st === 'vencida') ? br(l.dataAgendada) : '';
      return `<button class="item ${k === selKey ? 'sel' : ''}" data-k="${k}">
        <i style="background:${COR[st]}"></i>
        <span><strong>${i + 1} · ${esc(l.nome)}</strong><small>Loja ${l.num} · ${esc(l.cidade)}</small></span>
        <span class="st" style="color:${st === 'pendente' ? 'var(--tinta2)' : COR[st]}">${ROTULO[st]}<small>${data}</small></span>
      </button>`;
    }).join('')}`;
  $('rVoltar').onclick = sairRoteiro;
  if ($('rAgendar')) $('rAgendar').onclick = () => agendarRoteiro(rotSel);
}

/* ---------- ORDENAÇÃO E FILTRO ---------- */
const PESO = {vencida:0, agendada:1, pendente:2, visitada:3};
function ordenar(arr){
  return arr.sort((a,b) => {
    const sa = statusEf(a[1]), sb = statusEf(b[1]);
    if (sa !== sb) return PESO[sa] - PESO[sb];
    if (sa === 'agendada' || sa === 'vencida') return (a[1].dataAgendada||'').localeCompare(b[1].dataAgendada||'');
    if (sa === 'visitada') return (b[1].dataVisita||'').localeCompare(a[1].dataVisita||'');
    return a[1].num - b[1].num;
  });
}
function filtradas(){
  const q = $('busca').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const fs = $('fStatus').value, fc = $('fCidade').value;
  return ordenar(Object.entries(lojas).filter(([k,l]) => {
    const s = statusEf(l);
    if (fs !== 'todas' && fs !== s) return false;
    if (fc && l.cidade !== fc) return false;
    if (q) {
      const alvo = `${l.num} ${l.nome} ${l.cidade}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (!alvo.includes(q)) return false;
    }
    return true;
  }));
}

/* ---------- RENDER ---------- */
function render(){
  const todas = Object.values(lojas), t = todas.length;
  const c = {visitada:0, agendada:0, vencida:0, pendente:0};
  todas.forEach(l => c[statusEf(l)]++);
  const agTotal = c.agendada + c.vencida;
  const pct = t ? Math.round(c.visitada / t * 100) : 0;

  let tit = c.visitada === 0
    ? `Nenhuma das ${num(t)} lojas visitada ainda`
    : `${num(c.visitada)} de ${num(t)} lojas visitadas (${pct}%)`;
  if (c.vencida) tit += `, ${num(c.vencida)} ${c.vencida === 1 ? 'vencida' : 'vencidas'}`;
  else if (agTotal) tit += `, ${num(agTotal)} ${agTotal === 1 ? 'agendada' : 'agendadas'}`;
  const rc = ROTEIROS.filter(r => resumoRot(r.id).estado === 'concluido').length;
  $('titulo').textContent = tit;

  const prox = todas.filter(l => statusEf(l) === 'agendada').sort((a,b) => a.dataAgendada.localeCompare(b.dataAgendada))[0];
  $('subtitulo').textContent = `${num(rc)} de ${num(ROTEIROS.length)} roteiros concluídos. ` + (prox ? `Próxima visita: ${prox.nome} (${prox.cidade}) em ${br(prox.dataAgendada)}. ` : 'Nenhuma visita agendada. ')
    + `Faltam ${num(c.pendente)} lojas sem data.` + (editor ? '' : ' Modo consulta.');

  // trilha
  const ord = ordenar(Object.entries(lojas)).sort((a,b) => {
    const o = {visitada:0, vencida:1, agendada:2, pendente:3};
    return o[statusEf(a[1])] - o[statusEf(b[1])];
  });
  $('trilha').innerHTML = ord.map(([k,l]) => `<button data-k="${k}" style="background:${COR[statusEf(l)]}" title="${l.num} · ${esc(l.nome)}" aria-label="${esc(l.nome)}, ${ROTULO[statusEf(l)]}"></button>`).join('');
  $('legTrilha').textContent = `${num(t)} lojas`;

  // kpis
  const k = [
    ['visitada', 'Visitadas', c.visitada, COR.visitada],
    ['agendada', 'Agendadas no prazo', c.agendada, COR.agendada],
    ['vencida', 'Agendadas vencidas', c.vencida, c.vencida >= 3 ? COR.vencida : c.vencida >= 1 ? COR.agendada : COR.visitada],
    ['pendente', 'Sem data', c.pendente, '#8A948C'],
  ];
  $('kpis').innerHTML = k.map(([s,r,v,cor]) => `<button class="kpi ${kpiAtivo===s?'ativo':''}" data-s="${s}" style="--cor:${cor}"><b>${num(v)}</b><span>${r}</span></button>`).join('')
    + `<div class="kpi" style="--cor:#0F4D1A;cursor:default"><b>${pct}%</b><span>Concluído</span><div class="barra"><i style="width:${pct}%"></i></div></div>`;

  // cidades
  const cidades = [...new Set(todas.map(l => l.cidade))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  const fc = $('fCidade'), atual = fc.value;
  fc.innerHTML = '<option value="">Todas as cidades</option>' + cidades.map(ci => {
    const n = todas.filter(l => l.cidade === ci).length;
    return `<option value="${esc(ci)}">${esc(ci)} (${num(n)})</option>`;
  }).join('');
  fc.value = cidades.includes(atual) ? atual : '';

  // lista
  const lista = filtradas();
  $('contagem').textContent = `${num(lista.length)} de ${num(t)} lojas`;
  $('itens').innerHTML = lista.length ? lista.map(([k,l]) => {
    const s = statusEf(l);
    const data = s === 'visitada' ? br(l.dataVisita) : (s === 'agendada' || s === 'vencida') ? br(l.dataAgendada) : '';
    return `<button class="item ${k===selKey?'sel':''}" data-k="${k}">
      <i style="background:${COR[s]}"></i>
      <span><strong>${l.num} · ${esc(l.nome)}</strong><small>${esc(l.cidade)}</small></span>
      <span class="st" style="color:${s==='pendente'?'var(--tinta2)':COR[s]}">${ROTULO[s]}<small>${data}</small></span>
    </button>`;
  }).join('') : '<div class="vazio">Nenhuma loja com esses filtros. Limpe os filtros para ver todas.</div>';

  document.querySelectorAll('.abas button').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
  $('painelRot').style.display = aba === 'roteiros' ? '' : 'none';
  $('painelLojas').style.display = aba === 'lojas' ? '' : 'none';
  renderRoteiros();
  desenharMarcadores();
  $('btnLogin').textContent = editor ? 'Sair' : 'Entrar';
  $('btnLogin').className = editor ? 'btn claro' : 'btn laranja';
  $('btnNova').disabled = !editor;
}

/* ---------- GAVETA: LOJA ---------- */
let rascunho = null;
function abrirLoja(k){
  const l = lojas[k]; if (!l) return;
  sairModoNova();
  selKey = k; modo = 'loja';
  rascunho = {status: l.status || 'pendente', dataAgendada: l.dataAgendada || '', dataVisita: l.dataVisita || '', obs: l.obs || ''};
  $('gTitulo').textContent = `${l.num} · ${l.nome}`;
  $('gSub').textContent = `Loja ${l.num} · ${l.cidade}${ROT_ID[rotDe(l)] ? ' · roteiro ' + ROT_ID[rotDe(l)].nome : ''}${l.cnpj ? ' · CNPJ ' + l.cnpj : ''}`;
  desenharForm(k);
  abrirGaveta();
  if (!rotSel || rotDe(l) !== rotSel) { rotSel = null; mapa.flyTo([l.lat, l.lng], Math.max(mapa.getZoom(), 30)); }
  render();
}
function desenharForm(k){
  const l = lojas[k], r = rascunho, dis = editor ? '' : 'disabled';
  $('gCorpo').innerHTML = `
    <div class="endereco">${esc(l.endereco)}</div>
    <div class="links">
      <a href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener">Traçar rota</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" rel="noopener">Abrir no Google Maps</a>
    </div>
    <label>Status da visita</label>
    <div class="seg" id="seg">
      ${['pendente','agendada','visitada'].map(s => `<button type="button" data-s="${s}" aria-pressed="${r.status===s}" ${dis}>${ROTULO[s]}</button>`).join('')}
    </div>
    ${r.status !== 'pendente' ? `<div class="dupla">
      <div><label for="dAg">Data agendada</label><input type="date" id="dAg" value="${r.dataAgendada}" ${dis}></div>
      ${r.status === 'visitada' ? `<div><label for="dVi">Data da visita</label><input type="date" id="dVi" value="${r.dataVisita}" ${dis}></div>` : '<div></div>'}
    </div>` : ''}
    <label for="obs">Observações</label>
    <textarea id="obs" placeholder="Pontos levantados, pendências, contato na loja" ${dis}>${esc(r.obs)}</textarea>
    ${editor ? '' : '<div class="bloqueio">Para marcar visita, entre com seu e-mail e senha.</div>'}
    <div class="hist" id="hist"></div>`;
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => {
    guardarCampos();
    rascunho.status = b.dataset.s;
    if (rascunho.status === 'visitada' && !rascunho.dataVisita) rascunho.dataVisita = hoje();
    desenharForm(k);
  });
  $('gRodape').innerHTML = editor
    ? `${l.origem === 'nova' ? '<button class="btn perigo" id="gExcluir">Excluir loja</button>' : '<span></span>'}<button class="btn prim" id="gSalvar">Salvar visita</button>`
    : `<span></span><button class="btn prim" id="gEntrar">Entrar para editar</button>`;
  if ($('gSalvar')) $('gSalvar').onclick = () => salvarVisita(k);
  if ($('gExcluir')) $('gExcluir').onclick = () => excluirLoja(k);
  if ($('gEntrar')) $('gEntrar').onclick = abrirLogin;
  carregarHistorico(k);
}
function guardarCampos(){
  if ($('dAg')) rascunho.dataAgendada = $('dAg').value;
  if ($('dVi')) rascunho.dataVisita = $('dVi').value;
  if ($('obs')) rascunho.obs = $('obs').value;
}
async function salvarVisita(k){
  guardarCampos();
  const r = rascunho, antes = lojas[k].status || 'pendente';
  if (r.status === 'agendada' && !r.dataAgendada) return toast('Informe a data agendada');
  if (r.status === 'visitada' && !r.dataVisita) return toast('Informe a data da visita');
  if (r.status === 'visitada' && r.dataVisita > hoje()) return toast('A data da visita não pode ser futura');
  const dados = {
    status: r.status,
    dataAgendada: r.status === 'pendente' ? '' : r.dataAgendada,
    dataVisita: r.status === 'visitada' ? r.dataVisita : '',
    obs: r.obs.trim(),
    atualizadoEm: firebase.database.ServerValue.TIMESTAMP,
    atualizadoPor: usuario.email
  };
  try {
    await db.ref('lojas/' + k).update(dados);
    await db.ref('historico').push({key:k, de:antes, para:r.status, data: r.status==='visitada'?r.dataVisita:r.dataAgendada, em: firebase.database.ServerValue.TIMESTAMP, por: usuario.email});
    toast('Visita salva');
    fecharGaveta();
  } catch(e){ toast('Não salvou: ' + (e.code || e.message)); }
}
function carregarHistorico(k){
  db.ref('historico').orderByChild('key').equalTo(k).limitToLast(5).once('value').then(s => {
    const h = []; s.forEach(c => { h.push(c.val()); });
    if (!h.length || selKey !== k || !$('hist')) return;
    $('hist').innerHTML = '<h3>Últimas alterações</h3>' + h.reverse().map(x =>
      `<div>${new Date(x.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}: ${ROTULO[x.de]||x.de} para ${ROTULO[x.para]||x.para}${x.data ? ' (' + br(x.data) + ')' : ''}, por ${esc(x.por)}</div>`).join('');
  }).catch(() => {});
}
async function excluirLoja(k){
  const l = lojas[k];
  if (!confirm(`Excluir a loja ${l.num} · ${l.nome}? Só lojas incluídas manualmente podem ser excluídas.`)) return;
  try { await db.ref('lojas/' + k).remove(); toast('Loja excluída'); fecharGaveta(); }
  catch(e){ toast('Não excluiu: ' + (e.code || e.message)); }
}

/* ---------- GAVETA: NOVA LOJA ---------- */
function abrirNova(){
  if (!editor) return abrirLogin();
  selKey = null; modo = 'nova';
  $('gTitulo').textContent = 'Incluir loja';
  $('gSub').textContent = 'Ela entra no mapa como pendente.';
  $('gCorpo').innerHTML = `
    <div class="dupla">
      <div><label for="nNum">Nº da loja</label><input id="nNum" type="number" min="1" inputmode="numeric"></div>
      <div><label for="nCod">Código</label><input id="nCod"></div>
    </div>
    <label for="nNome">Nome da loja</label><input id="nNome" placeholder="Ex.: Vila Madalena">
    <label for="nCnpj">CNPJ</label><input id="nCnpj">
    <label for="nEnd">Endereço completo</label><input id="nEnd" placeholder="Rua, número, bairro, cidade, CEP">
    <label for="nCid">Cidade</label><input id="nCid" list="listaCid">
    <datalist id="listaCid">${[...new Set(Object.values(lojas).map(l=>l.cidade))].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <label for="nRot">Roteiro</label>
    <select id="nRot"><option value="">Sem roteiro</option>${ROTEIROS.map(r => `<option value="${r.id}">${esc(r.grupo)} · ${esc(r.nome)}</option>`).join('')}</select>
    <label for="nCoord">Coordenadas (latitude, longitude)</label>
    <input id="nCoord" placeholder="-23.550520, -46.633308">
    <div class="dica">No Google Maps, clique com o botão direito na loja e copie o primeiro item. Ou clique no ponto certo do mapa.</div>
    <div class="erro" id="nErro"></div>`;
  $('gRodape').innerHTML = '<button class="btn" id="nCancelar" style="border-color:var(--linha)">Cancelar</button><button class="btn prim" id="nSalvar">Incluir loja</button>';
  $('nCancelar').onclick = fecharGaveta;
  $('nSalvar').onclick = salvarNova;
  $('nCoord').addEventListener('change', () => { const c = lerCoord($('nCoord').value); if (c) { marcarTemp(c[0], c[1]); mapa.setView(c, 40); } });
  $('avisoMapa').style.display = 'block';
  abrirGaveta();
  render();
}
function lerCoord(txt){
  const m = String(txt).replace(/\s/g,'').match(/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  if (lat < SP_BOUNDS[0][0] || lat > SP_BOUNDS[1][0] || lng < SP_BOUNDS[0][1] || lng > SP_BOUNDS[1][1]) return null;
  return [lat, lng];
}
async function salvarNova(){
  const n = parseInt($('nNum').value, 10), nome = $('nNome').value.trim().toUpperCase().replace(/\s+/g,' ');
  const cid = $('nCid').value.trim().replace(/\s+/g,' '), coord = lerCoord($('nCoord').value);
  const err = msg => { $('nErro').textContent = msg; };
  if (!n || n < 1) return err('Informe o número da loja.');
  if (lojas['L' + n]) return err(`Já existe a loja ${n} (${lojas['L'+n].nome}).`);
  if (!nome) return err('Informe o nome da loja.');
  if (!cid) return err('Informe a cidade.');
  if (!coord) return err('Coordenadas inválidas ou fora do estado de SP. Use o formato -23.55, -46.63.');
  const nova = {num:n, nome, codigo:$('nCod').value.trim(), cnpj:$('nCnpj').value.trim(), endereco:$('nEnd').value.trim().replace(/\s+/g,' '),
    cidade:cid, roteiro:$('nRot').value, lat:+coord[0].toFixed(6), lng:+coord[1].toFixed(6), origem:'nova', status:'pendente', dataAgendada:'', dataVisita:'', obs:'',
    criadoEm: firebase.database.ServerValue.TIMESTAMP, criadoPor: usuario.email};
  try {
    await db.ref('lojas/L' + n).set(nova);
    toast('Loja incluída');
    fecharGaveta();
  } catch(e){ err('Não salvou: ' + (e.code || e.message)); }
}
function sairModoNova(){
  $('avisoMapa').style.display = 'none';
  limparTemp();
}

/* ---------- GAVETA GERAL ---------- */
function abrirGaveta(){ $('gaveta').classList.add('aberta'); $('gaveta').setAttribute('aria-hidden','false'); }
function fecharGaveta(){
  $('gaveta').classList.remove('aberta'); $('gaveta').setAttribute('aria-hidden','true');
  sairModoNova(); selKey = null; modo = null; render();
}
$('gFechar').onclick = fecharGaveta;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharGaveta(); $('mLogin').classList.remove('aberto'); } });

/* ---------- EVENTOS ---------- */
$('itens').onclick = e => { const b = e.target.closest('.item'); if (b) abrirLoja(b.dataset.k); };
$('painelRot').onclick = e => {
  const it = e.target.closest('.item'); if (it) return abrirLoja(it.dataset.k);
  const r = e.target.closest('.rot'); if (r) selecionarRoteiro(r.dataset.r);
};
document.querySelector('.abas').onclick = e => { const b = e.target.closest('button'); if (b) { aba = b.dataset.aba; render(); } };
$('trilha').onclick = e => { const b = e.target.closest('button'); if (b) abrirLoja(b.dataset.k); };
$('kpis').onclick = e => {
  const b = e.target.closest('button.kpi'); if (!b) return;
  kpiAtivo = kpiAtivo === b.dataset.s ? 'todas' : b.dataset.s; aba = 'lojas';
  $('fStatus').value = kpiAtivo; render();
};
$('busca').oninput = render;
$('fStatus').onchange = () => { kpiAtivo = $('fStatus').value; render(); };
$('fCidade').onchange = () => {
  render();
  const v = $('fCidade').value;
  const pts = Object.values(lojas).filter(l => !v || l.cidade === v).map(l => [l.lat, l.lng]);
  if (v && pts.length) mapa.fitBounds(pts); else if (!v) mapa.fitBounds(SP_BOUNDS);
};
$('limpar').onclick = () => { $('busca').value=''; $('fStatus').value='todas'; $('fCidade').value=''; kpiAtivo='todas'; render(); mapa.fitBounds(SP_BOUNDS); };
$('btnNova').onclick = abrirNova;
$('btnCsv').onclick = () => {
  const cab = ['Nº loja','Loja','Roteiro','Cidade','Código','CNPJ','Endereço','Status','Data agendada','Data visita','Observações','Latitude','Longitude'];
  const linhas = ordenar(Object.entries(lojas)).map(([k,l]) => [l.num,l.nome,(ROT_ID[rotDe(l)]||{}).nome||'',l.cidade,l.codigo,l.cnpj,l.endereco,ROTULO[statusEf(l)],br(l.dataAgendada),br(l.dataVisita),l.obs,String(l.lat).replace('.',','),String(l.lng).replace('.',',')]);
  const csv = '\ufeff' + [cab, ...linhas].map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `visitas_lojas_oba_${hoje()}.csv`; a.click();
};

/* ---------- LOGIN ---------- */
function abrirLogin(){ $('lErro').textContent=''; $('mLogin').classList.add('aberto'); setTimeout(() => $('lEmail').focus(), 50); }
$('btnLogin').onclick = async () => {
  if (editor) { await auth.signOut(); toast('Você saiu. Painel em modo consulta.'); }
  else abrirLogin();
};
$('lCancelar').onclick = () => $('mLogin').classList.remove('aberto');
$('formLogin').onsubmit = async e => {
  e.preventDefault();
  try {
    await auth.signInWithEmailAndPassword($('lEmail').value.trim(), $('lSenha').value);
    $('mLogin').classList.remove('aberto'); $('lSenha').value=''; toast('Edição liberada');
  } catch(err){
    $('lErro').textContent = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code)
      ? 'E-mail ou senha incorretos.' : 'Não entrou: ' + err.code;
  }
};

/* desenha a base na hora, mesmo sem banco */
lojas = JSON.parse(JSON.stringify(SEED));
render();
mapa.fitBounds(SP_BOUNDS);

if (semBanco) $('subtitulo').textContent = 'Sem conexão com o banco (gstatic.com bloqueado). Mostrando a base local, sem salvar.';

let refLojas = null;
auth.onAuthStateChanged(u => {
  if (!u) { auth.signInAnonymously().catch(e => { $('subtitulo').textContent = 'Sem conexão com o banco (' + e.code + '). Mostrando a base local, sem salvar.'; }); return; }
  usuario = u; editor = !u.isAnonymous;
  if (refLojas) refLojas.off();
  refLojas = db.ref('lojas');
  refLojas.on('value', snap => {
    const v = snap.val();
    if (!v) {
      lojas = JSON.parse(JSON.stringify(SEED));
      if (editor) db.ref('lojas').transaction(atual => atual === null ? SEED : undefined).then(() => toast('Base com 75 lojas gravada no banco'));
    } else lojas = v;
    carregou = true;
    if (selKey && !lojas[selKey]) fecharGaveta();
        render();
    if (selKey && modo === 'loja') { guardarCampos(); desenharForm(selKey); }
  }, e => { $('subtitulo').textContent = 'Sem acesso ao banco (' + e.code + '). Mostrando a base local, sem salvar.'; });
});
</script>
