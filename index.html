<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitas às Lojas Oba SP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --folha:#1E6B43; --folha-esc:#123F28; --manga:#E39A2D; --pedra:#A6ADA8; --tomate:#C43E3E;
  --tinta:#17251C; --tinta2:#55625A; --fundo:#EEF1EC; --sup:#FFFFFF; --linha:#D9DFD8;
  --f-corpo:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-titulo:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-corpo);color:var(--tinta);background:var(--fundo);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--manga);outline-offset:2px}

.app{display:grid;grid-template-rows:auto auto auto 1fr;height:100%}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 20px 8px;background:var(--folha-esc);color:#fff}
header h1{font-family:var(--f-titulo);font-weight:700;font-size:clamp(22px,3vw,34px);line-height:1.05;margin:0;letter-spacing:.2px}
header p{margin:4px 0 0;color:#BFD3C5;font-size:14px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid transparent;border-radius:6px;padding:8px 14px;font-weight:600;background:var(--sup);color:var(--tinta)}
.btn.prim{background:var(--folha);color:#fff}
.btn.claro{background:transparent;border-color:#5E8A6F;color:#fff}
.btn.perigo{background:transparent;border-color:var(--tomate);color:var(--tomate)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.trilha-wrap{background:var(--folha-esc);padding:6px 20px 14px}
.trilha{display:flex;gap:2px;height:14px}
.trilha button{flex:1;border:0;padding:0;border-radius:2px;min-width:3px}
.trilha button:hover{transform:scaleY(1.5)}
.trilha-leg{display:flex;justify-content:space-between;color:#BFD3C5;font-size:12px;margin-top:6px}

.kpis{display:flex;background:var(--sup);border-bottom:1px solid var(--linha);overflow-x:auto}
.kpi{flex:1;min-width:120px;border:0;background:none;text-align:left;padding:10px 18px;border-right:1px solid var(--linha);border-bottom:3px solid transparent}
.kpi.ativo{border-bottom-color:currentColor}
.kpi b{display:block;font-family:var(--f-titulo);font-size:30px;line-height:1;font-weight:700}
.kpi span{font-size:13px;color:var(--tinta2)}
.kpi .sinal{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

main{display:grid;grid-template-columns:1fr 390px;min-height:0}
#mapa{min-height:0;background:#DDE5DC}
.zoom-rapido{position:absolute;z-index:500;top:10px;right:10px;display:flex;gap:4px}
.zoom-rapido button{border:1px solid var(--linha);background:var(--sup);border-radius:5px;padding:5px 10px;font-weight:600;font-size:13px;box-shadow:0 1px 3px rgba(23,37,28,.18)}
.mapa-box{position:relative;min-height:0}
.aviso-mapa{position:absolute;z-index:500;left:50%;top:10px;transform:translateX(-50%);background:var(--manga);color:#2A1A00;font-weight:600;padding:6px 12px;border-radius:5px;display:none}

.lista{display:flex;flex-direction:column;min-height:0;background:var(--sup);border-left:1px solid var(--linha)}
.filtros{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--linha)}
.filtros input,.filtros select{width:100%;padding:8px 10px;border:1px solid var(--linha);border-radius:6px;background:var(--fundo)}
.filtros input{grid-column:1/-1}
.cont{padding:8px 14px;font-size:13px;color:var(--tinta2);display:flex;justify-content:space-between;align-items:center}
.cont button{border:0;background:none;color:var(--folha);font-weight:600;padding:0}
#itens{overflow-y:auto;flex:1}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);background:none;padding:10px 14px 10px 0}
.item:hover{background:#F5F7F4}
.item.sel{background:#E7F0E9}
.item i{border-radius:0 3px 3px 0}
.item strong{display:block;font-weight:600}
.item small{color:var(--tinta2)}
.item .st{text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.item .st small{display:block;font-weight:400}
.vazio{padding:30px 16px;color:var(--tinta2);text-align:center}

/* gaveta */
.gaveta{position:fixed;z-index:1000;top:0;right:0;height:100%;width:min(420px,100%);background:var(--sup);box-shadow:-8px 0 30px rgba(23,37,28,.22);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.gaveta.aberta{transform:none}
.gav-topo{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:10px}
.gav-topo h2{font-family:var(--f-titulo);font-size:26px;line-height:1.05;margin:0}
.gav-topo p{margin:4px 0 0;color:var(--tinta2);font-size:13px}
.fechar{border:0;background:none;font-size:26px;line-height:1;padding:0 4px;color:var(--tinta2)}
.gav-corpo{padding:16px 18px;overflow-y:auto;flex:1}
.gav-corpo label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
.gav-corpo input,.gav-corpo textarea,.gav-corpo select{width:100%;padding:9px 10px;border:1px solid var(--linha);border-radius:6px;background:var(--fundo)}
.gav-corpo textarea{min-height:80px;resize:vertical}
.endereco{background:var(--fundo);border-radius:6px;padding:10px 12px;font-size:14px}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.links a,.links button{font-size:13px;font-weight:600;color:var(--folha);background:none;border:1px solid var(--linha);border-radius:6px;padding:6px 10px;text-decoration:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--linha);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--sup);padding:10px 4px;font-weight:600;border-right:1px solid var(--linha)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-s="pendente"]{background:var(--pedra);color:#fff}
.seg button[aria-pressed="true"][data-s="agendada"]{background:var(--manga);color:#2A1A00}
.seg button[aria-pressed="true"][data-s="visitada"]{background:var(--folha);color:#fff}
.gav-rodape{padding:14px 18px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:space-between}
.bloqueio{margin-top:16px;padding:12px;border-radius:6px;background:#FFF6E6;color:#6B4600;font-size:14px}
.hist{margin-top:18px;font-size:13px;color:var(--tinta2)}
.hist h3{font-size:13px;color:var(--tinta);margin:0 0 6px}
.hist div{padding:5px 0;border-top:1px dashed var(--linha)}
.dica{font-size:12px;color:var(--tinta2);margin-top:4px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dupla label{margin-top:14px}

.modal-fundo{position:fixed;inset:0;z-index:1100;background:rgba(18,30,22,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal-fundo.aberto{display:flex}
.modal{background:var(--sup);border-radius:10px;padding:20px;width:min(360px,100%)}
.modal h2{font-family:var(--f-titulo);margin:0 0 4px;font-size:26px}
.modal label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.modal input{width:100%;padding:9px 10px;border:1px solid var(--linha);border-radius:6px}
.erro{color:var(--tomate);font-size:13px;margin-top:8px;min-height:18px}

.toast{position:fixed;z-index:1200;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:6px;font-weight:600;transition:transform .2s}
.toast.on{transform:translateX(-50%) translateY(0)}

#svgMapa{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab}
#svgMapa:active{cursor:grabbing}
#mapa{height:100%}

@media (max-width:860px){
  .app{display:block;height:auto}
  html,body{height:auto}
  header{flex-direction:column}
  .acoes{justify-content:flex-start}
  main{display:block}
  #mapa{height:55vh}
  .lista{border-left:0}
  #itens{overflow:visible}
  .gaveta{top:auto;bottom:0;height:88vh;width:100%;border-radius:14px 14px 0 0;transform:translateY(105%)}
  .gaveta.aberta{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="titulo">Carregando lojas…</h1>
      <p id="subtitulo">&nbsp;</p>
    </div>
    <div class="acoes">
      <button class="btn claro" id="btnCsv">Exportar CSV</button>
      <button class="btn claro" id="btnNova">Incluir loja</button>
      <button class="btn" id="btnLogin">Entrar</button>
    </div>
  </header>
  <div class="trilha-wrap">
    <div class="trilha" id="trilha" aria-label="Uma barra por loja, colorida pelo status"></div>
    <div class="trilha-leg"><span>Visitadas primeiro</span><span id="legTrilha"></span></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <main>
    <div class="mapa-box">
      <div id="mapa"></div>
      <div class="zoom-rapido">
        <button data-z="estado">Estado</button>
        <button data-z="capital">Capital</button>
        <button data-z="campinas">Campinas</button>
      </div>
      <div class="aviso-mapa" id="avisoMapa">Clique no mapa onde fica a loja</div>
    </div>
    <section class="lista">
      <div class="filtros">
        <input id="busca" type="search" placeholder="Buscar por nome, número ou cidade">
        <select id="fStatus">
          <option value="todas">Todos os status</option>
          <option value="pendente">Pendentes</option>
          <option value="agendada">Agendadas no prazo</option>
          <option value="vencida">Agendadas vencidas</option>
          <option value="visitada">Visitadas</option>
        </select>
        <select id="fCidade"><option value="">Todas as cidades</option></select>
      </div>
      <div class="cont"><span id="contagem"></span><button id="limpar">Limpar filtros</button></div>
      <div id="itens"></div>
    </section>
  </main>
</div>

<aside class="gaveta" id="gaveta" aria-hidden="true">
  <div class="gav-topo">
    <div><h2 id="gTitulo"></h2><p id="gSub"></p></div>
    <button class="fechar" id="gFechar" aria-label="Fechar">×</button>
  </div>
  <div class="gav-corpo" id="gCorpo"></div>
  <div class="gav-rodape" id="gRodape"></div>
</aside>

<div class="modal-fundo" id="mLogin">
  <form class="modal" id="formLogin">
    <h2>Entrar para editar</h2>
    <p style="margin:0;color:var(--tinta2);font-size:14px">Sem login, o painel fica só para consulta.</p>
    <label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required>
    <label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required>
    <div class="erro" id="lErro"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button type="button" class="btn" id="lCancelar" style="border-color:var(--linha)">Cancelar</button>
      <button type="submit" class="btn prim">Entrar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

  Object.values(lojas).forEach(l => { (cid[l.cidade] = cid[l.cidade] || []).push(PX(l.lat, l.lng)); });
  gRot.innerHTML = Object.entries(cid).map(([c, ps]) => {
    const x = ps.reduce((s, p) => s + p[0], 0)/ps.length, y = Math.min(...ps.map(p => p[1]));
    return `<text data-fixo="${ROT_FIXOS.includes(c) ? 1 : 0}" data-x="${x}" data-y="${y}" x="${x}" y="${y}" text-anchor="middle" fill="#55625A" font-weight="600">${esc(c)}</text>`;
  }).join('');
}
function atualizarTamanhos(){
  const s = escalaTela(), z = mapa.getZoom();
  gPinos.querySelectorAll('circle').forEach(c => c.setAttribute('r', (+c.dataset.r) * s));
  gTemp.querySelectorAll('circle').forEach(c => c.setAttribute('r', 9 * s));
  gRot.querySelectorAll('text').forEach(t => {
    const ver = z < 6 && (z >= 3 || t.dataset.fixo === '1');
    t.style.display = ver ? '' : 'none';
    t.setAttribute('font-size', 12 * s);
    t.setAttribute('y', +t.dataset.y - 12 * s);
  });
  posicionarEtiquetas();
}
function desenharMarcadores(){
  desenharRotulos();
  const ord = Object.entries(lojas).sort((a, b) => {
    const o = {pendente:0, agendada:1, vencida:2, visitada:3};
    return (a[0] === selKey) - (b[0] === selKey) || o[statusEf(a[1])] - o[statusEf(b[1])];
  });
  gPinos.innerHTML = ord.map(([k, l]) => {
    const s = statusEf(l), sel = k === selKey, [x, y] = PX(l.lat, l.lng);
    return `<circle data-k="${k}" data-r="${sel ? 11 : s === 'pendente' ? 5 : 8}" cx="${x}" cy="${y}" fill="${COR[s]}" stroke="${sel ? '#17251C' : '#fff'}" stroke-width="${sel ? 3 : 1.5}" vector-effect="non-scaling-stroke" style="cursor:pointer"><title>${l.num} · ${esc(l.nome)} (${ROTULO[s]})</title></circle>`;
  }).join('');
  atualizarTamanhos();
}

/* etiquetas: só visitadas e agendadas, com data, sem sobrepor */
function posicionarEtiquetas(){
  const s = escalaTela(), cw = svg.clientWidth, ch = svg.clientHeight;
  const vx0 = vista.cx - vista.w/2, vy0 = vista.cy - (vista.w * ch / cw)/2;
  const PRI = {vencida:0, agendada:1, visitada:2};
  const alvos = Object.entries(lojas).filter(([k, l]) => statusEf(l) !== 'pendente' || k === selKey)
    .map(([k, l]) => { const [x, y] = PX(l.lat, l.lng); return {k, l, s:statusEf(l), sx:(x - vx0)/s, sy:(y - vy0)/s, x, y}; })
    .filter(a => a.sx > -40 && a.sx < cw + 40 && a.sy > -40 && a.sy < ch + 40)
    .sort((a, b) => (b.k === selKey) - (a.k === selKey) || PRI[a.s] - PRI[b.s]
      || (a.s === 'visitada' ? (b.l.dataVisita||'').localeCompare(a.l.dataVisita||'') : (a.l.dataAgendada||'').localeCompare(b.l.dataAgendada||'')));
  const ocupado = [], sai = [];
  const bate = r => ocupado.some(o => r.x < o.x + o.w + 3 && r.x + r.w + 3 > o.x && r.y < o.y + o.h + 3 && r.y + r.h + 3 > o.y);
  const curto = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : '';
  for (const a of alvos) {
    const txt1 = a.l.nome;
    const txt2 = a.s === 'visitada' ? `Visitada ${curto(a.l.dataVisita)}` : a.s === 'pendente' ? 'Sem data' : `${a.s === 'vencida' ? 'Vencida' : 'Agendada'} ${curto(a.l.dataAgendada)}`;
    const w = Math.max(txt1.length * 7.6, txt2.length * 7.2) + 18, h = 34, d = 12;
    const cands = [[a.sx + d, a.sy - h/2], [a.sx - d - w, a.sy - h/2], [a.sx - w/2, a.sy - d - h], [a.sx - w/2, a.sy + d],
                   [a.sx + d, a.sy - h - 2], [a.sx + d, a.sy + 2], [a.sx - d - w, a.sy - h - 2], [a.sx - d - w, a.sy + 2]];
    const c = cands.map(([x, y]) => ({x, y, w, h})).find(r => !bate(r));
    if (!c) continue;
    ocupado.push(c);
    const cor = COR[a.s], X = vx0 + c.x * s, Y = vy0 + c.y * s;
    sai.push(`<g data-k="${a.k}" style="cursor:pointer">
      <rect data-k="${a.k}" x="${X}" y="${Y}" width="${w*s}" height="${h*s}" rx="${4*s}" fill="#fff" stroke="${cor}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <rect data-k="${a.k}" x="${X}" y="${Y}" width="${4*s}" height="${h*s}" fill="${cor}"/>
      <text data-k="${a.k}" x="${X + 10*s}" y="${Y + 14*s}" font-size="${11.5*s}" font-weight="600" fill="#17251C">${esc(txt1)}</text>
      <text data-k="${a.k}" x="${X + 10*s}" y="${Y + 27*s}" font-size="${11*s}" font-weight="600" fill="${a.s === 'agendada' ? '#9A6410' : cor}">${txt2}</text>
    </g>`);
  }
  gNomes.innerHTML = sai.join('');
}
function marcarTemp(lat, lng){
  const [x, y] = PX(lat, lng);
  gTemp.innerHTML = `<circle cx="${x}" cy="${y}" fill="none" stroke="#17251C" stroke-width="3" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  atualizarTamanhos();
}
function limparTemp(){ gTemp.innerHTML = ''; }

/* arrastar, zoom na roda e pinça */
const ponteiros = new Map(); let arrasto = null, moveu = false, pinca = null;
const pontoSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), s = escalaTela(), h = vista.w * r.height / r.width;
  return [vista.cx - vista.w/2 + (cx - r.left) * s, vista.cy - h/2 + (cy - r.top) * s]; };
function zoomEm(cx, cy, f){
  const [x, y] = pontoSvg(cx, cy);
  const nw = Math.min(Math.max(vista.w / f, ESTADO_W / 400), ESTADO_W * 1.6), k = nw / vista.w;
  vista.cx = x + (vista.cx - x) * k; vista.cy = y + (vista.cy - y) * k; vista.w = nw; aplicarVista();
}
svg.addEventListener('wheel', e => { e.preventDefault(); zoomEm(e.clientX, e.clientY, e.deltaY < 0 ? 1.25 : 0.8); }, {passive:false});
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId); ponteiros.set(e.pointerId, [e.clientX, e.clientY]); moveu = false;
  if (ponteiros.size === 1) arrasto = {x:e.clientX, y:e.clientY, cx:vista.cx, cy:vista.cy, alvo:e.target};
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; pinca = Math.hypot(a[0]-b[0], a[1]-b[1]); arrasto = null; }
});
svg.addEventListener('pointermove', e => {
  if (!ponteiros.has(e.pointerId)) return;
  ponteiros.set(e.pointerId, [e.clientX, e.clientY]);
  if (ponteiros.size === 2 && pinca) {
    const [a, b] = [...ponteiros.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    zoomEm((a[0]+b[0])/2, (a[1]+b[1])/2, d / pinca); pinca = d; moveu = true; return;
  }
  if (!arrasto) return;
  const dx = e.clientX - arrasto.x, dy = e.clientY - arrasto.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) moveu = true;
  if (moveu) { const s = escalaTela(); vista.cx = arrasto.cx - dx * s; vista.cy = arrasto.cy - dy * s; aplicarVista(); }
});
function soltar(e){
  if (!ponteiros.has(e.pointerId)) return;
  ponteiros.delete(e.pointerId);
  if (ponteiros.size < 2) pinca = null;
  if (arrasto && !moveu && e.type === 'pointerup') {
    const alvo = arrasto.alvo;
    if (alvo && alvo.dataset && alvo.dataset.k) abrirLoja(alvo.dataset.k);
    else if (modo === 'nova') {
      const [x, y] = pontoSvg(e.clientX, e.clientY), [lat, lng] = LL(x, y);
      $('nCoord').value = lat.toFixed(6) + ', ' + lng.toFixed(6);
      marcarTemp(lat, lng); $('avisoMapa').style.display = 'none';
    }
  }
  if (ponteiros.size === 0) arrasto = null;
}
svg.addEventListener('pointerup', soltar);
svg.addEventListener('pointercancel', soltar);
document.querySelectorAll('.zoom-rapido button').forEach(b => b.onclick = () => {
  const z = b.dataset.z;
  if (z === 'estado') mapa.fitBounds(SP_BOUNDS);
  if (z === 'capital') mapa.setView([-23.575, -46.66], 16);
  if (z === 'campinas') mapa.setView([-22.885, -47.06], 18);
});
new ResizeObserver(() => aplicarVista()).observe(svg);

/* ---------- ORDENAÇÃO E FILTRO ---------- */
const PESO = {vencida:0, agendada:1, pendente:2, visitada:3};
function ordenar(arr){
  return arr.sort((a,b) => {
    const sa = statusEf(a[1]), sb = statusEf(b[1]);
    if (sa !== sb) return PESO[sa] - PESO[sb];
    if (sa === 'agendada' || sa === 'vencida') return (a[1].dataAgendada||'').localeCompare(b[1].dataAgendada||'');
    if (sa === 'visitada') return (b[1].dataVisita||'').localeCompare(a[1].dataVisita||'');
    return a[1].num - b[1].num;
  });
}
function filtradas(){
  const q = $('busca').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const fs = $('fStatus').value, fc = $('fCidade').value;
  return ordenar(Object.entries(lojas).filter(([k,l]) => {
    const s = statusEf(l);
    if (fs !== 'todas' && fs !== s) return false;
    if (fc && l.cidade !== fc) return false;
    if (q) {
      const alvo = `${l.num} ${l.nome} ${l.cidade}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (!alvo.includes(q)) return false;
    }
    return true;
  }));
}

/* ---------- RENDER ---------- */
function render(){
  const todas = Object.values(lojas), t = todas.length;
  const c = {visitada:0, agendada:0, vencida:0, pendente:0};
  todas.forEach(l => c[statusEf(l)]++);
  const agTotal = c.agendada + c.vencida;
  const pct = t ? Math.round(c.visitada / t * 100) : 0;

  let tit = c.visitada === 0
    ? `Nenhuma das ${num(t)} lojas visitada ainda`
    : `${num(c.visitada)} de ${num(t)} lojas visitadas (${pct}%)`;
  if (c.vencida) tit += `, ${num(c.vencida)} ${c.vencida === 1 ? 'agendamento vencido' : 'agendamentos vencidos'}`;
  else if (agTotal) tit += `, ${num(agTotal)} ${agTotal === 1 ? 'agendada' : 'agendadas'}`;
  $('titulo').textContent = tit;

  const prox = todas.filter(l => statusEf(l) === 'agendada').sort((a,b) => a.dataAgendada.localeCompare(b.dataAgendada))[0];
  $('subtitulo').textContent = (prox ? `Próxima visita: ${prox.nome} (${prox.cidade}) em ${br(prox.dataAgendada)}. ` : 'Nenhuma visita agendada. ')
    + `Faltam ${num(c.pendente)} lojas sem data.` + (editor ? '' : ' Modo consulta.');

  // trilha
  const ord = ordenar(Object.entries(lojas)).sort((a,b) => {
    const o = {visitada:0, vencida:1, agendada:2, pendente:3};
    return o[statusEf(a[1])] - o[statusEf(b[1])];
  });
  $('trilha').innerHTML = ord.map(([k,l]) => `<button data-k="${k}" style="background:${COR[statusEf(l)]}" title="${l.num} · ${esc(l.nome)}" aria-label="${esc(l.nome)}, ${ROTULO[statusEf(l)]}"></button>`).join('');
  $('legTrilha').textContent = `${num(t)} lojas`;

  // kpis
  const k = [
    ['visitada', 'Visitadas', c.visitada, COR.visitada],
    ['agendada', 'Agendadas no prazo', c.agendada, COR.agendada],
    ['vencida', 'Agendadas vencidas', c.vencida, c.vencida >= 3 ? COR.vencida : c.vencida >= 1 ? COR.agendada : COR.visitada],
    ['pendente', 'Sem data', c.pendente, COR.pendente],
  ];
  $('kpis').innerHTML = k.map(([s,r,v,cor]) => `<button class="kpi ${kpiAtivo===s?'ativo':''}" data-s="${s}" style="color:${cor}"><b style="color:var(--tinta)">${num(v)}</b><span><i class="sinal" style="background:${cor}"></i>${r}</span></button>`).join('')
    + `<div class="kpi" style="cursor:default"><b>${pct}%</b><span>Concluído</span></div>`;

  // cidades
  const cidades = [...new Set(todas.map(l => l.cidade))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  const fc = $('fCidade'), atual = fc.value;
  fc.innerHTML = '<option value="">Todas as cidades</option>' + cidades.map(ci => {
    const n = todas.filter(l => l.cidade === ci).length;
    return `<option value="${esc(ci)}">${esc(ci)} (${num(n)})</option>`;
  }).join('');
  fc.value = cidades.includes(atual) ? atual : '';

  // lista
  const lista = filtradas();
  $('contagem').textContent = `${num(lista.length)} de ${num(t)} lojas`;
  $('itens').innerHTML = lista.length ? lista.map(([k,l]) => {
    const s = statusEf(l);
    const data = s === 'visitada' ? br(l.dataVisita) : (s === 'agendada' || s === 'vencida') ? br(l.dataAgendada) : '';
    return `<button class="item ${k===selKey?'sel':''}" data-k="${k}">
      <i style="background:${COR[s]}"></i>
      <span><strong>${l.num} · ${esc(l.nome)}</strong><small>${esc(l.cidade)}</small></span>
      <span class="st" style="color:${s==='pendente'?'var(--tinta2)':COR[s]}">${ROTULO[s]}<small>${data}</small></span>
    </button>`;
  }).join('') : '<div class="vazio">Nenhuma loja com esses filtros. Limpe os filtros para ver todas.</div>';

  desenharMarcadores();
  $('btnLogin').textContent = editor ? 'Sair' : 'Entrar';
  $('btnNova').disabled = !editor;
}

/* ---------- GAVETA: LOJA ---------- */
let rascunho = null;
function abrirLoja(k){
  const l = lojas[k]; if (!l) return;
  sairModoNova();
  selKey = k; modo = 'loja';
  rascunho = {status: l.status || 'pendente', dataAgendada: l.dataAgendada || '', dataVisita: l.dataVisita || '', obs: l.obs || ''};
  $('gTitulo').textContent = `${l.num} · ${l.nome}`;
  $('gSub').textContent = `${l.cidade}${l.codigo ? ' · código ' + l.codigo : ''}${l.cnpj ? ' · CNPJ ' + l.cnpj : ''}`;
  desenharForm(k);
  abrirGaveta();
  mapa.flyTo([l.lat, l.lng], Math.max(mapa.getZoom(), 30));
  render();
}
function desenharForm(k){
  const l = lojas[k], r = rascunho, dis = editor ? '' : 'disabled';
  $('gCorpo').innerHTML = `
    <div class="endereco">${esc(l.endereco)}</div>
    <div class="links">
      <a href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener">Traçar rota</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" rel="noopener">Abrir no Google Maps</a>
    </div>
    <label>Status da visita</label>
    <div class="seg" id="seg">
      ${['pendente','agendada','visitada'].map(s => `<button type="button" data-s="${s}" aria-pressed="${r.status===s}" ${dis}>${ROTULO[s]}</button>`).join('')}
    </div>
    ${r.status !== 'pendente' ? `<div class="dupla">
      <div><label for="dAg">Data agendada</label><input type="date" id="dAg" value="${r.dataAgendada}" ${dis}></div>
      ${r.status === 'visitada' ? `<div><label for="dVi">Data da visita</label><input type="date" id="dVi" value="${r.dataVisita}" ${dis}></div>` : '<div></div>'}
    </div>` : ''}
    <label for="obs">Observações</label>
    <textarea id="obs" placeholder="Pontos levantados, pendências, contato na loja" ${dis}>${esc(r.obs)}</textarea>
    ${editor ? '' : '<div class="bloqueio">Para marcar visita, entre com seu e-mail e senha.</div>'}
    <div class="hist" id="hist"></div>`;
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => {
    guardarCampos();
    rascunho.status = b.dataset.s;
    if (rascunho.status === 'visitada' && !rascunho.dataVisita) rascunho.dataVisita = hoje();
    desenharForm(k);
  });
  $('gRodape').innerHTML = editor
    ? `${l.origem === 'nova' ? '<button class="btn perigo" id="gExcluir">Excluir loja</button>' : '<span></span>'}<button class="btn prim" id="gSalvar">Salvar visita</button>`
    : `<span></span><button class="btn prim" id="gEntrar">Entrar para editar</button>`;
  if ($('gSalvar')) $('gSalvar').onclick = () => salvarVisita(k);
  if ($('gExcluir')) $('gExcluir').onclick = () => excluirLoja(k);
  if ($('gEntrar')) $('gEntrar').onclick = abrirLogin;
  carregarHistorico(k);
}
function guardarCampos(){
  if ($('dAg')) rascunho.dataAgendada = $('dAg').value;
  if ($('dVi')) rascunho.dataVisita = $('dVi').value;
  if ($('obs')) rascunho.obs = $('obs').value;
}
async function salvarVisita(k){
  guardarCampos();
  const r = rascunho, antes = lojas[k].status || 'pendente';
  if (r.status === 'agendada' && !r.dataAgendada) return toast('Informe a data agendada');
  if (r.status === 'visitada' && !r.dataVisita) return toast('Informe a data da visita');
  if (r.status === 'visitada' && r.dataVisita > hoje()) return toast('A data da visita não pode ser futura');
  const dados = {
    status: r.status,
    dataAgendada: r.status === 'pendente' ? '' : r.dataAgendada,
    dataVisita: r.status === 'visitada' ? r.dataVisita : '',
    obs: r.obs.trim(),
    atualizadoEm: firebase.database.ServerValue.TIMESTAMP,
    atualizadoPor: usuario.email
  };
  try {
    await db.ref('lojas/' + k).update(dados);
    await db.ref('historico').push({key:k, de:antes, para:r.status, data: r.status==='visitada'?r.dataVisita:r.dataAgendada, em: firebase.database.ServerValue.TIMESTAMP, por: usuario.email});
    toast('Visita salva');
    fecharGaveta();
  } catch(e){ toast('Não salvou: ' + (e.code || e.message)); }
}
function carregarHistorico(k){
  db.ref('historico').orderByChild('key').equalTo(k).limitToLast(5).once('value').then(s => {
    const h = []; s.forEach(c => { h.push(c.val()); });
    if (!h.length || selKey !== k || !$('hist')) return;
    $('hist').innerHTML = '<h3>Últimas alterações</h3>' + h.reverse().map(x =>
      `<div>${new Date(x.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}: ${ROTULO[x.de]||x.de} para ${ROTULO[x.para]||x.para}${x.data ? ' (' + br(x.data) + ')' : ''}, por ${esc(x.por)}</div>`).join('');
  }).catch(() => {});
}
async function excluirLoja(k){
  const l = lojas[k];
  if (!confirm(`Excluir a loja ${l.num} · ${l.nome}? Só lojas incluídas manualmente podem ser excluídas.`)) return;
  try { await db.ref('lojas/' + k).remove(); toast('Loja excluída'); fecharGaveta(); }
  catch(e){ toast('Não excluiu: ' + (e.code || e.message)); }
}

function lerCoord(txt){
  const m = String(txt).replace(/\s/g,'').match(/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  if (lat < SP_BOUNDS[0][0] || lat > SP_BOUNDS[1][0] || lng < SP_BOUNDS[0][1] || lng > SP_BOUNDS[1][1]) return null;
  return [lat, lng];
}
async function salvarNova(){
  const n = parseInt($('nNum').value, 10), nome = $('nNome').value.trim().toUpperCase().replace(/\s+/g,' ');
  const cid = $('nCid').value.trim().replace(/\s+/g,' '), coord = lerCoord($('nCoord').value);
  const err = msg => { $('nErro').textContent = msg; };
  if (!n || n < 1) return err('Informe o número da loja.');
  if (lojas['L' + n]) return err(`Já existe a loja ${n} (${lojas['L'+n].nome}).`);
  if (!nome) return err('Informe o nome da loja.');
  if (!cid) return err('Informe a cidade.');
  if (!coord) return err('Coordenadas inválidas ou fora do estado de SP. Use o formato -23.55, -46.63.');
  const nova = {num:n, nome, codigo:$('nCod').value.trim(), cnpj:$('nCnpj').value.trim(), endereco:$('nEnd').value.trim().replace(/\s+/g,' '),
    cidade:cid, lat:+coord[0].toFixed(6), lng:+coord[1].toFixed(6), origem:'nova', status:'pendente', dataAgendada:'', dataVisita:'', obs:'',
    criadoEm: firebase.database.ServerValue.TIMESTAMP, criadoPor: usuario.email};
  try {
    await db.ref('lojas/L' + n).set(nova);
    toast('Loja incluída');
    fecharGaveta();
  } catch(e){ err('Não salvou: ' + (e.code || e.message)); }
}
function sairModoNova(){
  $('avisoMapa').style.display = 'none';
  limparTemp();
}

/* ---------- GAVETA GERAL ---------- */
function abrirGaveta(){ $('gaveta').classList.add('aberta'); $('gaveta').setAttribute('aria-hidden','false'); }
function fecharGaveta(){
  $('gaveta').classList.remove('aberta'); $('gaveta').setAttribute('aria-hidden','true');
  sairModoNova(); selKey = null; modo = null; render();
}
$('gFechar').onclick = fecharGaveta;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharGaveta(); $('mLogin').classList.remove('aberto'); } });

/* ---------- EVENTOS ---------- */
$('itens').onclick = e => { const b = e.target.closest('.item'); if (b) abrirLoja(b.dataset.k); };
$('trilha').onclick = e => { const b = e.target.closest('button'); if (b) abrirLoja(b.dataset.k); };
$('kpis').onclick = e => {
  const b = e.target.closest('button.kpi'); if (!b) return;
  kpiAtivo = kpiAtivo === b.dataset.s ? 'todas' : b.dataset.s;
  $('fStatus').value = kpiAtivo; render();
};
$('busca').oninput = render;
$('fStatus').onchange = () => { kpiAtivo = $('fStatus').value; render(); };
$('fCidade').onchange = () => {
  render();
  const v = $('fCidade').value;
  const pts = Object.values(lojas).filter(l => !v || l.cidade === v).map(l => [l.lat, l.lng]);
  if (v && pts.length) mapa.fitBounds(pts); else if (!v) mapa.fitBounds(SP_BOUNDS);
};
$('limpar').onclick = () => { $('busca').value=''; $('fStatus').value='todas'; $('fCidade').value=''; kpiAtivo='todas'; render(); mapa.fitBounds(SP_BOUNDS); };
$('btnNova').onclick = abrirNova;
$('btnCsv').onclick = () => {
  const cab = ['Nº loja','Loja','Cidade','Código','CNPJ','Endereço','Status','Data agendada','Data visita','Observações','Latitude','Longitude'];
  const linhas = ordenar(Object.entries(lojas)).map(([k,l]) => [l.num,l.nome,l.cidade,l.codigo,l.cnpj,l.endereco,ROTULO[statusEf(l)],br(l.dataAgendada),br(l.dataVisita),l.obs,String(l.lat).replace('.',','),String(l.lng).replace('.',',')]);
  const csv = '\ufeff' + [cab, ...linhas].map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `visitas_lojas_oba_${hoje()}.csv`; a.click();
};

/* ---------- LOGIN ---------- */
function abrirLogin(){ $('lErro').textContent=''; $('mLogin').classList.add('aberto'); setTimeout(() => $('lEmail').focus(), 50); }
$('btnLogin').onclick = async () => {
  if (editor) { await auth.signOut(); toast('Você saiu. Painel em modo consulta.'); }
  else abrirLogin();
};
$('lCancelar').onclick = () => $('mLogin').classList.remove('aberto');
$('formLogin').onsubmit = async e => {
  e.preventDefault();
  try {
    await auth.signInWithEmailAndPassword($('lEmail').value.trim(), $('lSenha').value);
    $('mLogin').classList.remove('aberto'); $('lSenha').value=''; toast('Edição liberada');
  } catch(err){
    $('lErro').textContent = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code)
      ? 'E-mail ou senha incorretos.' : 'Não entrou: ' + err.code;
  }
};

/* desenha a base na hora, mesmo sem banco */
lojas = JSON.parse(JSON.stringify(SEED));
render();
mapa.fitBounds(SP_BOUNDS);

if (semBanco) $('subtitulo').textContent = 'Sem conexão com o banco (gstatic.com bloqueado). Mostrando a base local, sem salvar.';

let refLojas = null;
auth.onAuthStateChanged(u => {
  if (!u) { auth.signInAnonymously().catch(e => { $('subtitulo').textContent = 'Sem conexão com o banco (' + e.code + '). Mostrando a base local, sem salvar.'; }); return; }
  usuario = u; editor = !u.isAnonymous;
  if (refLojas) refLojas.off();
  refLojas = db.ref('lojas');
  refLojas.on('value', snap => {
    const v = snap.val();
    if (!v) {
      lojas = JSON.parse(JSON.stringify(SEED));
      if (editor) db.ref('lojas').transaction(atual => atual === null ? SEED : undefined).then(() => toast('Base com 75 lojas gravada no banco'));
    } else lojas = v;
    carregou = true;
    if (selKey && !lojas[selKey]) fecharGaveta();
        render();
    if (selKey && modo === 'loja') { guardarCampos(); desenharForm(selKey); }
  }, e => { $('subtitulo').textContent = 'Sem acesso ao banco (' + e.code + '). Mostrando a base local, sem salvar.'; });
});
</script>
